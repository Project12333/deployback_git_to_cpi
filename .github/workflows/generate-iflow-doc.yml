name: Generate CPI Docs (Offline)

on:
  workflow_dispatch:
    inputs:
      package:
        description: "CPI Package folder name"
        required: true

jobs:
  docs:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          pip install requests python-docx

      - name: Verify Ollama
        run: |
          curl http://localhost:11434/api/tags

      - name: Generate documentation
        run: |
          python tools/generate_iflow_docs.py "${{ inputs.package }}"

      - name: Commit docs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add generated-docs || echo "Nothing to add"
          git commit -m "Generate CPI docs for ${{ inputs.package }}" || echo "No changes"
          git push
