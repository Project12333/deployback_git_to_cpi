name: Generate CPI Docs (By Package)

on:
  workflow_dispatch:
    inputs:
      package:
        description: "CPI Package folder name (inside cpi-artifacts)"
        required: true
        type: string

jobs:
  docs:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          pip install requests python-docx

      - name: Check Ollama
        run: |
          curl http://localhost:11434/api/tags

      - name: Generate docs for selected package
        run: |
          python tools/generate_iflow_docs.py "${{ inputs.package }}"

      - name: Commit generated docs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add generated-docs || echo "Nothing to add"
          git commit -m "Generate CPI docs for package ${{ inputs.package }}" || echo "No changes"
          git push
