name: Generate CPI iFlow Documentation

on:
  workflow_dispatch:
    inputs:
      package:
        description: "CPI Package name (folder under cpi-artifacts)"
        required: true
        type: string

jobs:
  generate-doc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate docs for selected package
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          python tools/generate_package_docs.py

      - name: Commit generated docs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "Auto-generate CPI docs for package ${{ inputs.p
