name: Deploy CPI Package & Artifacts

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Enter package IDs (comma or space separated)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize package list
        id: normalize
        run: |
          RAW="${{ github.event.inputs.packages }}"
          CLEANED=$(echo "$RAW" | tr ',' ' ')
          echo "packages=$CLEANED" >> $GITHUB_OUTPUT

      - name: Upload Package & Deploy Artifacts
        env:
          TMN_HOST: ${{ secrets.DEV_TMN_HOST }}
          OAUTH_HOST: ${{ secrets.DEV_OAUTH_HOST }}
          CLIENT_ID: ${{ secrets.DEV_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.DEV_CLIENT_SECRET }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e TMN_HOST="$TMN_HOST" \
            -e OAUTH_HOST="$OAUTH_HOST" \
            -e CLIENT_ID="$CLIENT_ID" \
            -e CLIENT_SECRET="$CLIENT_SECRET" \
            engswee/flashpipe:latest \
            sh -c '
              for PKG in ${{ steps.normalize.outputs.packages }}; do
                echo "📦 Uploading package: $PKG"

                # ✅ Step 1: Upload package metadata from JSON
                flashpipe package-upload \
                  --tmn-host "$TMN_HOST" \
                  --oauth-host "$OAUTH_HOST" \
                  --oauth-clientid "$CLIENT_ID" \
                  --oauth-clientsecret "$CLIENT_SECRET" \
                  --package-id "$PKG" \
                  --package-file "cpi-artifacts/$PKG/${PKG}.json"

                echo "🚀 Deploying artifacts in package: $PKG"

                # ✅ Step 2: Deploy each artifact inside the package folder
                for ART in $(ls cpi-artifacts/$PKG); do
                  if [ -d "cpi-artifacts/$PKG/$ART" ]; then
                    echo "➡ Deploying artifact: $ART"
                    flashpipe deploy \
                      --tmn-host "$TMN_HOST" \
                      --oauth-host "$OAUTH_HOST" \
                      --oauth-clientid "$CLIENT_ID" \
                      --oauth-clientsecret "$CLIENT_SECRET" \
                      --artifact-ids "$ART" \
                      --dir-artifacts "cpi-artifacts/$PKG/$ART"
                  fi
                done

              done
            '

      - name: Deployment Completed
        run: echo "✅ Deployment finished successfully!"
