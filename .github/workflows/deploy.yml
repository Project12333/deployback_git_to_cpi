name: CPI CI/CD - Build, Upload, Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Zip each iFlow folder
      - name: Zip iFlows
        run: |
          cd cpi-artifacts/CPIPracticeflows
          for dir in */; do
            ARTIFACT=$(basename "$dir")
            zip -r "${ARTIFACT}.zip" "$dir"
            echo "Zipped $ARTIFACT"
          done

      # 3️⃣ Upload each ZIP to CPI (Design Time API)
      - name: Upload artifacts to CPI
        run: |
          PACKAGE="CPIPracticeflows"
          HOST="${{ secrets.CPI_HOST }}"
          USER="${{ secrets.CPI_USER }}"
          PASS="${{ secrets.CPI_PASSWORD }}"

          cd cpi-artifacts/CPIPracticeflows
          for zipfile in *.zip; do
            ARTIFACT="${zipfile%.zip}"
            VERSION="1.0.0"
            echo "Uploading $ARTIFACT"

            curl -X PUT \
              "https://$HOST/api/v1/IntegrationDesigntimeArtifacts(Id='$ARTIFACT',Version='$VERSION',Type='IFlow')/\$value" \
              -H "Content-Type: application/zip" \
              --data-binary "@$zipfile" \
              -u "$USER:$PASS"
          done

      # 4️⃣ Assign artifacts to package
      - name: Assign artifacts to package
        run: |
          PACKAGE="CPIPracticeflows"
          HOST="${{ secrets.DEV_TMN_HOST }}"
          USER="${{ secrets.CPI_USER }}"
          PASS="${{ secrets.CPI_PASSWORD }}"

          curl -X POST \
            "https://$HOST/api/v1/IntegrationPackages" \
            -H "Content-Type: application/json" \
            -d "{
              \"Id\": \"$PACKAGE\",
              \"Name\": \"$PACKAGE\",
              \"ShortText\": \"$PACKAGE\",
              \"Description\": \"Deployed via GitHub Actions\"
            }" \
            -u "$USER:$PASS" || true

      # 5️⃣ Deploy each artifact (Runtime API)
      - name: Deploy artifacts
        run: |
          HOST="${{ secrets.DEV_TMN_HOST }}"
          USER="${{ secrets.CPI_USER }}"
          PASS="${{ secrets.CPI_PASSWORD }}"

          cd cpi-artifacts/CPIPracticeflows
          for zipfile in *.zip; do
            ARTIFACT="${zipfile%.zip}"
            VERSION="1.0.0"
            echo "Deploying $ARTIFACT"

            curl -X POST \
              "https://$HOST/api/v1/IntegrationRuntimeArtifacts?Id='$ARTIFACT'&Version='$VERSION'" \
              -u "$USER:$PASS"
          done
