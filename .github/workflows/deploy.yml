name: Deploy CPI Artifacts Back to CPI

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload artifacts to CPI
        run: |
          PACKAGE="CPIPracticeflows"
          HOST="${{ secrets.CPI_HOST }}"
          USER="${{ secrets.CPI_USER }}"
          PASS="${{ secrets.CPI_PASSWORD }}"
          
          echo "Using host: $HOST"

          cd cpi-artifacts/CPIPracticeflows
          
          for zipfile in *.zip; do
            ARTIFACT="${zipfile%.zip}"
            VERSION="1.0.0"
            echo "Uploading $ARTIFACT"

            HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
              -X PUT "https://$HOST/api/v1/IntegrationDesigntimeArtifacts(Id='$ARTIFACT',Version='$VERSION',Type='IFlow')/\$value" \
              -H "Content-Type: application/zip" \
              --data-binary "@$zipfile" \
              -u "$USER:$PASS")

            echo "HTTP $HTTP_CODE"
            cat /tmp/resp.txt || true

            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "Upload failed for $ARTIFACT"
              exit 1
            fi
          done
