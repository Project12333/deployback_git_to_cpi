name: Deploy CPI Artifacts to CPI

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    container:
      image: ppiper/cx-server-companion:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy iFlows using Project Piper
        run: |
          for DIR in cpi-artifacts/CPIPracticeflows/*/ ; do
            IFLW_NAME=$(basename "$DIR")
            echo "Deploying $IFLW_NAME"

            piper cpiDeployIntegrationArtifact \
              --host "${{ secrets.CPI_HOST}}" \
              --tokenUrl "${{ secrets.DEV_OAUTH_HOST }}" \
              --clientId "${{ secrets.DEV_CLIENT_ID }}" \
              --clientSecret "${{ secrets.DEV_CLIENT_SECRET }}" \
              --integrationFlowId "$IFLW_NAME" \
              --packageId "CPIPracticeflows" \
              --filePath "$DIR"
          done
