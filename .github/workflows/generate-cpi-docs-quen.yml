name: Generate SAP CPI Documentation (Qubrid)

on:
  workflow_dispatch:
    inputs:
      package:
        description: "CPI package name under cpi-artifacts (example: CPIPracticeflows)"
        required: true
        type: string

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # Checkout source
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Setup Python
      # -------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -------------------------------------------------
      # Install dependencies
      # -------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-docx

      # -------------------------------------------------
      # Generate CPI documentation
      # -------------------------------------------------
      - name: Generate CPI iFlow documentation
        env:
          QUBRID_API_KEY: ${{ secrets.QUBRID_API_KEY }}
        run: |
          python tools/generate_quen_docs.py "${{ github.event.inputs.package }}"

      # -------------------------------------------------
      # Commit generated docs (SAFE)
      # -------------------------------------------------
      - name: Commit generated documentation
        run: |
          if [ -d "docs" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add docs/
            git commit -m "Auto-generate CPI docs for ${{ github.event.inputs.package }}" || echo "No changes to commit"
            git push
          else
            echo "No docs folder created, skipping commit"
          fi
