name: Generate SAP CPI Documentation (Qwen)

on:
  workflow_dispatch:
    inputs:
      package:
        description: "CPI Package name under cpi-artifacts (example: CPIPracticeflows)"
        required: true
        type: string

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-docx

      - name: Generate CPI iFlow documentation
        env:
          QUBRID_API_KEY: ${{ secrets.QUBRID_API_KEY }}
        run: |
          python tools/generate_quen_docs.py "${{ github.event.inputs.package }}"

      # OPTIONAL: Commit generated docs back to repo
      - name: Commit generated documentation
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/
          git commit -m "Auto-generate CPI docs for ${{ github.event.inputs.package }}" || echo "No changes to commit"
          git push
