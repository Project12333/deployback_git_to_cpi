name: Restructure CPI Artifacts

on:
  workflow_dispatch:

jobs:
  restructure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restructure folders
        run: |
          echo "📦 Restructuring gmailsender → gmail"

          # Ensure gmailsender folder exists
          if [ -d "cpi-artifacts/gmailsender" ]; then

            # Create target folder if missing
            mkdir -p cpi-artifacts/gmail

            # Move gmail artifact
            if [ -d "cpi-artifacts/gmailsender/gmail" ]; then
              mv cpi-artifacts/gmailsender/gmail cpi-artifacts/gmail/
              echo "✅ Moved artifact gmail to cpi-artifacts/gmail/gmail"
            fi

            # (Optional) Remove gmailsender folder if empty or no longer needed
            rm -rf cpi-artifacts/gmailsender
            echo "🗑️ Removed old gmailsender folder"
          else
            echo "⚠️ gmailsender folder does not exist. Nothing to restructure."
          fi

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Restructured artifacts for FlashPipe deployment" || echo "No changes to commit"
          git push || true

      - name: ✅ Done
        run: echo "✅ Restructure completed successfully!"
