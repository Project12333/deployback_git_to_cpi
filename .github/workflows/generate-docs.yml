name: Generate CPI Documentation

on:
  workflow_dispatch:
    inputs:
      package_id:
        required: true
        type: string

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pandoc jq

      - name: Start Ollama
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          sleep 10
          docker exec ollama ollama pull deepseek-r1:1.5b

      - name: Prepare Tools
        run: chmod +x tools/*.py tools/*.sh

      - name: Generate Documentation
        run: tools/generate_docs.sh "${{ github.event.inputs.package_id }}"

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cpi-artifacts/${{ github.event.inputs.package_id }} || true

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Automated CPI Documentation for package ${{ github.event.inputs.package_id }}"
          git push || true
