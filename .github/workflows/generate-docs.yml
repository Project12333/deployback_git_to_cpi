name: Generate CPI Documentation (LLM)

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Enter CPI Package Name"
        required: true

jobs:
  generate:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        shell: powershell
        run: |
          pip install --upgrade pip
          pip install requests python-docx

      - name: Verify Ollama
        shell: powershell
        run: |
          ollama list

      - name: Generate CPI documentation
        shell: powershell
        run: |
          python tools/generate_quen_docs.py --package "${{ github.event.inputs.package }}"

      - name: Commit generated document
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"

          git add cpi-artifacts/**/docs/*.docx

          $status = git status --porcelain
          if ($status) {
            git commit -m "Auto-generate CPI technical documentation"
            git push
          } else {
            Write-Host "No documentation changes detected"
          }
