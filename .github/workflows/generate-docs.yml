name: Generate CPI Documentation

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Enter the CPI Package Folder Name"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl start ollama

      - name: Pull DeepSeek R1
        run: |
          ollama pull deepseek-r1

      - name: Run Documentation Generator
        run: |
          chmod +x tools/run_generate_docs.sh
          ./tools/run_generate_docs.sh "${{ github.event.inputs.package }}"

      - name: Commit Docs
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add cpi-artifacts || true
          if git diff --staged --quiet; then
            echo "No docs to commit."
          else
            git commit -m "Auto-generated docs"
            git push
