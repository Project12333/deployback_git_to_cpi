name: Generate CPI Documentation (LLM)

on:
  push:
    paths:
      - "cpi-artifacts/**"
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify Ollama
        run: ollama list

      - name: Install Python deps
        run: |
          pip install requests python-docx

      - name: Generate Docs
        run: |
          python tools/generate_iflow_docs.py --package CPIPracticeflows

      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add cpi-artifacts/**/docs/*.docx
          git commit -m "Auto-generate CPI technical documentation" || echo "No changes"
          git push
