name: Auto-generate iFlow Documentation

on:
  push:
    paths:
      - 'cpi-artifacts/**'   # ANY flow exported from CPI triggers doc generation

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r docs-generator/requirements.txt

      - name: Generate documentation for all iFlows
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python docs-generator/generate_iflow.py

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "Auto-generated documentation" || echo "No changes"
          git push
