name: Generate CPI Documentation

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Enter CPI Package Name"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests python-docx

      - name: Generate Documentation via OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          chmod +x tools/run_generate_docs.sh
          ./tools/run_generate_docs.sh "${{ github.event.inputs.package }}"

      - name: Commit Docs
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add cpi-artifacts || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-generated docs"
            git push
          fi
