name: Generate CPI Documentation

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Enter the CPI Package Folder Name"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests python-docx

      - name: Run Documentation Generator (DeepSeek Cloud)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # optional: override URL if needed
          # DEEPSEEK_API_URL: ${{ secrets.DEEPSEEK_API_URL }}
        run: |
          chmod +x tools/run_generate_docs.sh
          ./tools/run_generate_docs.sh "${{ github.event.inputs.package }}"

      - name: Commit Docs
        env:
          GIT_AUTHOR_NAME: "GitHub Actions"
          GIT_AUTHOR_EMAIL: "actions@github.com"
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add cpi-artifacts || true
          if git diff --staged --quiet; then
            echo "No docs to commit."
          else
            git commit -m "Auto-generated docs for package ${{ github.event.inputs.package }}"
            git push
          fi
