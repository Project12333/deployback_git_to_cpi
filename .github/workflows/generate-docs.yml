name: Generate CPI Documentation (LLM)

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Enter CPI Package Name"
        required: true

jobs:
  generate:
    runs-on: self-hosted

    steps:
      # -------------------------------------------------
      # Checkout repository
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Install Python dependencies
      # -------------------------------------------------
      - name: Install Python dependencies
        shell: powershell
        run: |
          pip install --upgrade pip
          pip install requests python-docx

      # -------------------------------------------------
      # Verify Ollama is running (important)
      # -------------------------------------------------
      - name: Verify Ollama
        shell: powershell
        run: |
          ollama list

      # -------------------------------------------------
      # Generate CPI documentation
      # -------------------------------------------------
      - name: Generate CPI documentation
        shell: powershell
        run: |
          python tools/generate_iflow_docs.py --package "${{ github.event.inputs.package }}"

      # -------------------------------------------------
      # Commit generated document (PowerShell-safe)
      # -------------------------------------------------
      - name: Commit generated document
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"

          git add cpi-artifacts/**/docs/*.docx

          $status = git status --porcelain
          if ($status) {
            git commit -m "Auto-generate CPI technical documentation"
            git push
          } else {
            Write-Host "No changes to commit"
          }
