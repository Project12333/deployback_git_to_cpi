name: Deploy Selected CPI Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Select the CPI package to deploy"
        required: true
        type: choice
        options: [] # 🔥 AUTO-FILLED. DO NOT EDIT MANUALLY

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: engswee/flashpipe:latest

    steps:
      - uses: actions/checkout@v4

      - name: Update package
        uses: engswee/flashpipe-action/update/package@v1
        with:
          tmn-host: ${{ secrets.DEV_TMN_HOST }}
          oauth-host: ${{ secrets.DEV_OAUTH_HOST }}
          oauth-clientid: ${{ secrets.DEV_CLIENT_ID }}
          oauth-clientsecret: ${{ secrets.DEV_CLIENT_SECRET }}
          package-file-relative: cpi-artifacts/${{ github.event.inputs.package }}/${{ github.event.inputs.package }}.json

      - name: Deploy artifacts
        uses: engswee/flashpipe-action/sync@v1
        with:
          tmn-host: ${{ secrets.DEV_TMN_HOST }}
          oauth-host: ${{ secrets.DEV_OAUTH_HOST }}
          oauth-clientid: ${{ secrets.DEV_CLIENT_ID }}
          oauth-clientsecret: ${{ secrets.DEV_CLIENT_SECRET }}
          package-id: ${{ github.event.inputs.package }}
          target: tenant
          dir-artifacts-relative: cpi-artifacts/${{ github.event.inputs.package }}
