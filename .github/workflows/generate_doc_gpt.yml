name: 🤖 Generate Individual iFlow Documentation (Word)

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "CPI Integration Package ID (e.g. PDFconverter)"
        required: true
        type: string

jobs:
  document:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # -------------------------------------------------
    # 1. Checkout
    # -------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------------------------------
    # 2. Install dependencies
    # -------------------------------------------------
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq pandoc python3-pip
        pip3 install python-docx

    # -------------------------------------------------
    # 3. Create reference.docx (logos + page numbers)
    # -------------------------------------------------
    - name: Create reference.docx
      run: |
        python3 - <<'PY'
        from docx import Document
        from docx.shared import Cm
        from docx.enum.text import WD_ALIGN_PARAGRAPH
        from docx.oxml import OxmlElement
        from docx.oxml.ns import qn

        doc = Document()
        section = doc.sections[0]

        header = section.header
        table = header.add_table(rows=1, cols=2, width=Cm(16))
        table.autofit = False

        table.cell(0,0).paragraphs[0].add_run().add_picture(
            "tools/logos/sap.png", width=Cm(3.5)
        )
        table.cell(0,1).paragraphs[0].add_run().add_picture(
            "tools/logos/motiveminds.png", width=Cm(4.5)
        )

        footer = section.footer
        p = footer.paragraphs[0]
        p.alignment = WD_ALIGN_PARAGRAPH.RIGHT

        run = p.add_run()
        b = OxmlElement('w:fldChar'); b.set(qn('w:fldCharType'), 'begin')
        i = OxmlElement('w:instrText'); i.text = "PAGE"
        e = OxmlElement('w:fldChar'); e.set(qn('w:fldCharType'), 'end')
        run._r.extend([b, i, e])

        doc.save("tools/reference.docx")
        PY

    # -------------------------------------------------
    # 4. Generate iFlow documentation
    # -------------------------------------------------
    - name: Generate iFlow Documentation
      id: documentation_step
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PKG_ID: ${{ github.event.inputs.package_id }}
      run: |
        set -e

        API_URL="https://api.openai.com/v1/chat/completions"
        MODEL="gpt-4o-mini"
        BASE_DIR="cpi-artifacts/$PKG_ID"

        GENERATED=false

        while IFS= read -r IFLOW_DIR; do
          IFLOW_NAME=$(basename "$IFLOW_DIR")
          OUTPUT="$IFLOW_DIR/${IFLOW_NAME}_Technical_Specification.docx"

          AUTHOR=$(git log -1 --pretty=format:'%an')
          DATE=$(date +'%Y-%m-%d')
          VERSION="1.0.0"

          QUERY="Generate SAP CPI technical documentation for iFlow ${IFLOW_NAME}\n"
          QUERY+=$(find "$IFLOW_DIR" -type f \( -name '*.xml' -o -name '*.groovy' -o -name '*.iflw' \) -exec cat {} +)

          jq -n \
            --arg model "$MODEL" \
            --arg system "You are a senior SAP CPI Technical Architect. Output valid Markdown only." \
            --arg user "$QUERY" \
            '{model:$model,messages:[{role:"system",content:$system},{role:"user",content:$user}],temperature:0.1}' \
            > payload.json

          RESPONSE=$(curl -s -X POST "$API_URL" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json)

          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          [ -z "$CONTENT" ] && continue

          # -------- BUILD MARKDOWN SAFELY --------
          rm -f content.md

          printf "<div style=\"page-break-after: always; text-align:center; margin-top:180px;\">\n" >> content.md
          printf "<h1 style=\"color:#1f4e79;\">%s</h1>\n" "$IFLOW_NAME" >> content.md
          printf "<h2>Technical Specification Document</h2>\n<br><br>\n" >> content.md
          printf "<table border=\"1\" style=\"margin:auto; width:50%%;\">\n" >> content.md
          printf "<tr><td><b>Author</b></td><td>%s</td></tr>\n" "$AUTHOR" >> content.md
          printf "<tr><td><b>Date</b></td><td>%s</td></tr>\n" "$DATE" >> content.md
          printf "<tr><td><b>Version</b></td><td>%s</td></tr>\n" "$VERSION" >> content.md
          printf "</table>\n</div>\n\n" >> content.md

          printf "<div style=\"page-break-after: always;\">\n" >> content.md
          printf "<h1 style=\"color:#1f4e79;\">Table of Contents</h1>\n\n" >> content.md
          printf "1. Introduction  \n2. Integration Overview  \n3. Integration Scenarios  \n" >> content.md
          printf "4. Error Handling and Logging  \n5. Testing Validation  \n6. Reference Documents\n" >> content.md
          printf "</div>\n\n" >> content.md

          printf "%s\n" "$CONTENT" >> content.md

          pandoc content.md \
            --reference-doc=tools/reference.docx \
            -o "$OUTPUT"

          GENERATED=true
        done < <(find "$BASE_DIR" -type f -name '*.iflw' -printf '%h\n' | sort -u)

        echo "docs_generated=$GENERATED" >> "$GITHUB_OUTPUT"

    # -------------------------------------------------
    # 5. Commit & Push
    # -------------------------------------------------
    - name: Commit and push
      if: steps.documentation_step.outputs.docs_generated == 'true'
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add cpi-artifacts/**/*.docx
        git commit -m "🤖 Auto-generated CPI Technical Specification"
        git push
