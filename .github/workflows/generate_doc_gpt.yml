name: 🤖 Generate Individual iFlow Documentation

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "CPI Integration Package ID"
        required: true
        type: string

jobs:
  document:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-pip
          pip3 install python-docx

      - name: Generate iFlow Documentation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PKG_ID: ${{ github.event.inputs.package_id }}
        run: |
          set -e

          API_URL="https://api.openai.com/v1/chat/completions"
          MODEL="gpt-4o-mini"
          BASE_DIR="cpi-artifacts/${PKG_ID}"

          if [ ! -d "$BASE_DIR" ]; then
            echo "::error::Package directory not found: $BASE_DIR"
            exit 1
          fi

          SYSTEM_PROMPT="$(cat tools/prompt.txt)"

          find "$BASE_DIR" -type f -name '*.iflw' -printf '%h\n' | sort -u | while read IFLOW_DIR; do
            IFLOW_NAME=$(basename "$IFLOW_DIR")
            TMP_TXT="/tmp/${IFLOW_NAME}.txt"
            OUTPUT_DOC="$IFLOW_DIR/${IFLOW_NAME}_Summary.docx"

            find "$IFLOW_DIR" -type f \
              \( -name '*.xml' -o -name '*.groovy' -o -name '*.iflw' \) \
              -exec cat {} \; > "$TMP_TXT"

            jq -n \
              --arg model "$MODEL" \
              --arg system "$SYSTEM_PROMPT" \
              --rawfile user "$TMP_TXT" \
              '{model:$model,messages:[{role:"system",content:$system},{role:"user",content:$user}],temperature:0.1}' \
              > payload.json

            RESPONSE=$(curl -s -X POST "$API_URL" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              -d @payload.json)

            echo "$RESPONSE" | jq -r '.choices[0].message.content' > "$TMP_TXT"

            python3 tools/generate_docx.py \
              "$TMP_TXT" \
              "$OUTPUT_DOC" \
              "$IFLOW_NAME" \
              "AutoGenerated" \
              "1.0.0"
          done

      - name: Commit and push documents
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cpi-artifacts/**/_Summary.docx
          git commit -m "🤖 DOCS: Generate DOCX iFlow documentation" || true
          git push
