name: 🤖 Generation Individual iFlow Documentation (DOCX)
on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "The ID of the CPI Integration Package"
        required: true
        type: string

jobs:
  document:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          pip3 install python-docx requests

      - name: Generate DOCX Documentation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PKG_ID: ${{ github.event.inputs.package_id }}
        run: |
          # 1️⃣ PYTHON SCRIPT: BUILDS THE FULL STRUCTURE
          cat << 'EOF' > generate_docx.py
          import sys, json, requests
          from docx import Document
          from docx.shared import Inches, Pt, RGBColor
          from docx.enum.text import WD_ALIGN_PARAGRAPH

          def add_numbered_heading(doc, text, level, num_str):
              p = doc.add_heading(level=level)
              run = p.add_run(f"{num_str} {text}")
              run.font.color.rgb = RGBColor(31, 56, 100)
              run.font.size = Pt(16 if level == 1 else 13)

          def build_docx(iflow_name, author, date, json_content, output_path):
              doc = Document()
              data = json.loads(json_content)
              
              # --- PAGE 1: COVER ---
              for _ in range(5): doc.add_paragraph()
              title_p = doc.add_paragraph()
              title_p.alignment = WD_ALIGN_PARAGRAPH.CENTER
              run = title_p.add_run(iflow_name)
              run.font.size, run.font.bold = Pt(32), True
              doc.add_paragraph("Technical Specification Document").alignment = WD_ALIGN_PARAGRAPH.CENTER
              doc.add_page_break()

              # --- PAGE 2: TABLE OF CONTENTS ---
              doc.add_heading("Table of Contents", level=1)
              items = [
                  ("1. Introduction", 0), ("1.1 Purpose", 1), ("1.2 Scope", 1),
                  ("2. Integration Overview", 0), ("2.1 Integration Architecture", 1), ("2.2 Integration Components", 1),
                  ("3. Integration Scenarios", 0), ("3.1 Scenario Description", 1), ("3.2 Data Flows", 1), ("3.3 Security Requirements", 1),
                  ("4. Error Handling and Logging", 0),
                  ("5. Testing Validation", 0),
                  ("6. Reference Documents", 0)
              ]
              for text, ind in items:
                  p = doc.add_paragraph(text)
                  if ind == 1: p.paragraph_format.left_indent = Inches(0.3)
              doc.add_page_break()

              # --- PAGE 3+: CONTENT GENERATION ---
              # Section 1
              add_numbered_heading(doc, "Introduction", 1, "1.")
              add_numbered_heading(doc, "Purpose", 2, "1.1")
              doc.add_paragraph(data.get("purpose", ""))
              add_numbered_heading(doc, "Scope", 2, "1.2")
              doc.add_paragraph(data.get("scope", ""))

              # Section 2
              add_numbered_heading(doc, "Integration Overview", 1, "2.")
              add_numbered_heading(doc, "Integration Architecture", 2, "2.1")
              doc.add_paragraph(data.get("architecture", ""))
              add_numbered_heading(doc, "Integration Components", 2, "2.2")
              doc.add_paragraph(data.get("components", ""))

              # Section 3
              add_numbered_heading(doc, "Integration Scenarios", 1, "3.")
              add_numbered_heading(doc, "Scenario Description", 2, "3.1")
              doc.add_paragraph(data.get("scenario_desc", ""))
              add_numbered_heading(doc, "Data Flows", 2, "3.2")
              doc.add_paragraph(data.get("data_flows", ""))
              add_numbered_heading(doc, "Security Requirements", 2, "3.3")
              doc.add_paragraph(data.get("security", ""))

              # Section 4
              add_numbered_heading(doc, "Error Handling and Logging", 1, "4.")
              doc.add_paragraph(data.get("error_handling", ""))

              # Section 5
              add_numbered_heading(doc, "Testing Validation", 1, "5.")
              doc.add_paragraph(data.get("testing", ""))

              # Section 6
              add_numbered_heading(doc, "Reference Documents", 1, "6.")
              doc.add_paragraph(data.get("references", ""))

              doc.save(output_path)

          if __name__ == "__main__":
              build_docx(sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5])
          EOF

          # 2️⃣ EXECUTION & AI CALL
          BASE_DIR="cpi-artifacts/$PKG_ID"
          for IFLOW_DIR in "$BASE_DIR"/*; do
            if [ -d "$IFLOW_DIR" ]; then
              IFLOW_NAME=$(basename "$IFLOW_DIR")
              AUTHOR=$(git log -1 --pretty=format:'%an' || echo "Technical Lead")
              DATE=$(date +%Y-%m-%d)
              
              # PROMPT: Ask AI to return a JSON object covering all sections
              JSON_RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
                -H "Authorization: Bearer $OPENAI_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{
                  \"model\": \"gpt-4o-mini\",
                  \"messages\": [{\"role\": \"user\", \"content\": \"Generate a technical documentation JSON for SAP CPI iFlow: $IFLOW_NAME. Return ONLY JSON with keys: purpose, scope, architecture, components, scenario_desc, data_flows, security, error_handling, testing, references.\"}],
                  \"response_format\": { \"type\": \"json_object\" }
                }" | jq -r '.choices[0].message.content')

              python3 generate_docx.py "$IFLOW_NAME" "$AUTHOR" "$DATE" "$JSON_RESPONSE" "$IFLOW_DIR/${IFLOW_NAME}.docx"
            fi
          done

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "🤖 DOCS: Full 6-section content generated by AI" || echo "No changes"
          git push
