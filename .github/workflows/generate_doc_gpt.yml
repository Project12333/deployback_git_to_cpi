name: 🤖 Generate Individual iFlow Documentation (Word)

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "CPI Integration Package ID (e.g. PDFconverter)"
        required: true
        type: string

jobs:
  document:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # -------------------------------------------------
    # 1. Checkout
    # -------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------------------------------
    # 2. Install dependencies
    # -------------------------------------------------
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq pandoc python3-pip
        pip3 install python-docx

    # -------------------------------------------------
    # 3. Create reference.docx (logos + footer)
    # -------------------------------------------------
    - name: Create Word reference.docx
      run: |
        python3 - <<'PY'
        from docx import Document
        from docx.shared import Cm
        from docx.enum.text import WD_ALIGN_PARAGRAPH
        from docx.oxml import OxmlElement
        from docx.oxml.ns import qn

        doc = Document()
        section = doc.sections[0]

        # Header
        header = section.header
        table = header.add_table(rows=1, cols=2, width=Cm(16))
        table.autofit = False

        left = table.cell(0, 0).paragraphs[0]
        left.alignment = WD_ALIGN_PARAGRAPH.LEFT
        left.add_run().add_picture("tools/logos/sap.png", width=Cm(3.5))

        right = table.cell(0, 1).paragraphs[0]
        right.alignment = WD_ALIGN_PARAGRAPH.RIGHT
        right.add_run().add_picture("tools/logos/motiveminds.png", width=Cm(4.5))

        # Footer - page number
        footer = section.footer
        p = footer.paragraphs[0]
        p.alignment = WD_ALIGN_PARAGRAPH.RIGHT

        run = p.add_run()
        fld_begin = OxmlElement('w:fldChar')
        fld_begin.set(qn('w:fldCharType'), 'begin')

        instr = OxmlElement('w:instrText')
        instr.text = "PAGE"

        fld_end = OxmlElement('w:fldChar')
        fld_end.set(qn('w:fldCharType'), 'end')

        run._r.append(fld_begin)
        run._r.append(instr)
        run._r.append(fld_end)

        doc.save("tools/reference.docx")
        PY

    # -------------------------------------------------
    # 4. Generate iFlow documentation
    # -------------------------------------------------
    - name: Generate iFlow Documentation
      id: documentation_step
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PKG_ID: ${{ github.event.inputs.package_id }}
      run: |
        set -e

        API_URL="https://api.openai.com/v1/chat/completions"
        MODEL="gpt-4o-mini"
        BASE_DIR="cpi-artifacts/$PKG_ID"

        SYSTEM_PROMPT="You are a senior SAP CPI Technical Architect. Output valid Markdown only."

        GENERATED=false

        while IFS= read -r IFLOW_DIR; do
          IFLOW_NAME=$(basename "$IFLOW_DIR")
          OUTPUT="$IFLOW_DIR/${IFLOW_NAME}_Technical_Specification.docx"

          AUTHOR=$(git log -1 --pretty=format:'%an')
          DATE=$(date +'%Y-%m-%d')
          VERSION="1.0.0"

          QUERY="Generate documentation for iFlow $IFLOW_NAME"
          QUERY+=$'\n'
          QUERY+=$(find "$IFLOW_DIR" -type f -name '*.xml' -o -name '*.groovy' -o -name '*.iflw' -exec cat {} +)

          jq -n \
            --arg model "$MODEL" \
            --arg system "$SYSTEM_PROMPT" \
            --arg user "$QUERY" \
            '{model:$model,messages:[{role:"system",content:$system},{role:"user",content:$user}]}' \
            > payload.json

          RESPONSE=$(curl -s -X POST "$API_URL" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json)

          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          [ -z "$CONTENT" ] && continue

          cat > content.md <<'EOF'
<!-- PAGE 1 -->
<div style="page-break-after: always; text-align: center; margin-top: 180px;">
<h1 style="color:#1f4e79;">IFLOW_NAME</h1>
<h2>Technical Specification Document</h2>
<br><br>
<table border="1" style="margin:auto; width:50%;">
<tr><td><b>Author</b></td><td>AUTHOR</td></tr>
<tr><td><b>Date</b></td><td>DATE</td></tr>
<tr><td><b>Version</b></td><td>VERSION</td></tr>
</table>
</div>

<!-- PAGE 2 -->
<div style="page-break-after: always;">
<h1 style="color:#1f4e79;">Table of Contents</h1>
1. Introduction  
2. Integration Overview  
3. Integration Scenarios  
4. Error Handling  
5. Testing Validation  
6. Reference Documents
</div>

CONTENT_PLACEHOLDER
EOF

          sed -i "s/IFLOW_NAME/$IFLOW_NAME/g" content.md
          sed -i "s/AUTHOR/$AUTHOR/g" content.md
          sed -i "s/DATE/$DATE/g" content.md
          sed -i "s/VERSION/$VERSION/g" content.md
          sed -i "s|CONTENT_PLACEHOLDER|$CONTENT|" content.md

          pandoc content.md \
            --reference-doc=tools/reference.docx \
            -o "$OUTPUT"

          GENERATED=true
        done < <(find "$BASE_DIR" -type f -name '*.iflw' -printf '%h\n' | sort -u)

        echo "docs_generated=$GENERATED" >> "$GITHUB_OUTPUT"

    # -------------------------------------------------
    # 5. Commit & Push
    # -------------------------------------------------
    - name: Commit and push
      if: steps.documentation_step.outputs.docs_generated == 'true'
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add cpi-artifacts/**/*.docx
        git commit -m "🤖 Auto-generated CPI Technical Specification"
        git push
