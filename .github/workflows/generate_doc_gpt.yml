name: 🤖 Generate Individual iFlow DOCX Documentation

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "CPI Integration Package ID (e.g. Employedata)"
        required: true
        type: string

jobs:
  document:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies (jq + pandoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq pandoc

      - name: Generate DOCX Documentation
        id: documentation_step
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PKG_ID: ${{ github.event.inputs.package_id }}
          HEADING_COLOR: "#1f4e79"
        run: |
          set -e

          API_URL="https://api.openai.com/v1/chat/completions"
          MODEL_NAME="gpt-4o-mini"
          BASE_PKG_DIR="cpi-artifacts/$PKG_ID"

          if [ ! -d "$BASE_PKG_DIR" ]; then
            echo "::error::Package not found: $BASE_PKG_DIR"
            exit 1
          fi

          # ---- SYSTEM PROMPT ----
          SYSTEM_PROMPT="You are a senior SAP CPI Technical Architect.
Generate a complete SAP CPI Technical Specification document using the structure provided.
Use proper headings, tables, and detailed explanations derived strictly from the given artifacts."

          DOCS_GENERATED=false

          find "$BASE_PKG_DIR" -type f \( -name '*.iflw' -o -name 'iFlowContent.xml' \) -printf '%h\n' | sort -u | while read IFLOW_DIR; do
            IFLOW_NAME=$(basename "$IFLOW_DIR")
            OUTPUT_DOCX="$IFLOW_DIR/${IFLOW_NAME}_Technical_Specification.docx"

            echo "➡ Processing iFlow: $IFLOW_NAME"

            QUERY_FILE="query.txt"
            echo "Generate technical documentation for iFlow '$IFLOW_NAME'." > "$QUERY_FILE"

            find "$IFLOW_DIR" -type f \( -name '*.iflw' -o -name '*.groovy' -o -name '*.xslt' -o -name 'iFlowContent.xml' \) -print0 |
            while IFS= read -r -d '' FILE; do
              echo -e "\n--- FILE: $FILE ---\n" >> "$QUERY_FILE"
              cat "$FILE" >> "$QUERY_FILE"
            done

            jq -n \
              --arg model "$MODEL_NAME" \
              --arg system "$SYSTEM_PROMPT" \
              --rawfile user "$QUERY_FILE" \
              '{
                model: $model,
                messages: [
                  {role: "system", content: $system},
                  {role: "user", content: $user}
                ],
                temperature: 0.1
              }' > payload.json

            RESPONSE=$(curl -s -X POST "$API_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -d @payload.json)

            CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

            if [ -z "$CONTENT" ]; then
              echo "⚠️ No content generated for $IFLOW_NAME"
              continue
            fi

            # ---- Logos (LOCAL PATHS) ----
            SAP_LOGO="../../../tools/logos/sap.png"
            MM_LOGO="../../../tools/logos/motiveminds.png"

            HTML_FILE="doc.html"

            cat > "$HTML_FILE" <<EOF
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { font-family: Arial, sans-serif; }
h1, h2, h3 { color: ${HEADING_COLOR}; }
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid black; padding: 8px; }
th { background: #f2f2f2; }
.header { width:100%; }
.header img { height:60px; }
.header-left { float:left; }
.header-right { float:right; }
.clear { clear:both; }
.pagebreak { page-break-before: always; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="$SAP_LOGO">
  </div>
  <div class="header-right">
    <img src="$MM_LOGO">
  </div>
  <div class="clear"></div>
</div>

<h1 style="text-align:center;">$IFLOW_NAME</h1>
<h2 style="text-align:center;">Technical Specification Document</h2>

<div class="pagebreak"></div>

$CONTENT

</body>
</html>
EOF

            pandoc "$HTML_FILE" -o "$OUTPUT_DOCX"
            echo "✅ Generated: $OUTPUT_DOCX"

            DOCS_GENERATED=true

            rm -f payload.json "$QUERY_FILE" "$HTML_FILE"
          done

          echo "docs_generated=$DOCS_GENERATED" >> $GITHUB_OUTPUT

      - name: Commit and Push DOCX
        if: steps.documentation_step.outputs.docs_generated == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cpi-artifacts/**/**.docx
          git commit -m "🤖 DOCS: Generated CPI iFlow Technical Specification (DOCX)"
          git push
