name: 🤖 Generate Individual iFlow Documentation (DOCX)

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "CPI Integration Package ID (e.g. Employedata)"
        required: true
        type: string

jobs:
  document:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq pandoc

      - name: Generate iFlow Documentation (HTML → DOCX)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PKG_ID: ${{ github.event.inputs.package_id }}
        run: |
          set -e

          API_URL="https://api.openai.com/v1/chat/completions"
          MODEL_NAME="gpt-4o-mini"
          BASE_PKG_DIR="cpi-artifacts/$PKG_ID"
          PROMPT_FILE="tools/prompts/prompt.txt"

          if [ ! -d "$BASE_PKG_DIR" ]; then
            echo "::error::Package directory not found: $BASE_PKG_DIR"
            exit 1
          fi

          if [ ! -f "$PROMPT_FILE" ]; then
            echo "::error::Prompt file not found: $PROMPT_FILE"
            exit 1
          fi

          find "$BASE_PKG_DIR" -type f \( -name 'iFlowContent.xml' -o -name '*.iflw' \) -printf '%h\n' | sort -u | while read IFLOW_DIR; do
            IFLOW_NAME=$(basename "$IFLOW_DIR")
            OUTPUT_HTML="$IFLOW_DIR/${IFLOW_NAME}_Summary.html"
            OUTPUT_DOCX="$IFLOW_DIR/${IFLOW_NAME}_Summary.docx"

            QUERY_FILE=$(mktemp)
            echo "Generate documentation for iFlow: $IFLOW_NAME" > "$QUERY_FILE"

            find "$IFLOW_DIR" -type f \( -name '*.xml' -o -name '*.groovy' -o -name '*.xslt' -o -name '*.iflw' \) -print0 |
            while IFS= read -r -d '' f; do
              echo -e "\n--- FILE: $f ---\n" >> "$QUERY_FILE"
              cat "$f" >> "$QUERY_FILE"
            done

            PAYLOAD=$(jq -n \
              --rawfile system "$PROMPT_FILE" \
              --rawfile user "$QUERY_FILE" \
              --arg model "$MODEL_NAME" \
              '{model:$model,messages:[{role:"system",content:$system},{role:"user",content:$user}],temperature:0.1}')

            RESPONSE=$(curl -s -X POST "$API_URL" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")

            CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

            [ -z "$CONTENT" ] && continue

            AUTHOR=$(git log -1 --pretty=format:'%an')
            DATE=$(date +'%Y-%m-%d')

            printf '%s\n' \
"<html>
<head>
<meta charset='UTF-8'>
<style>
body { font-family: Arial; }
h1,h2 { color:#1f4e79; }
table { width:100%; border-collapse:collapse; }
th,td { border:1px solid #000; padding:8px; }
.header { display:flex; justify-content:space-between; }
.header img { height:60px; }
</style>
</head>
<body>

<div class='header'>
<img src='../../../tools/logos/sap.png'>
<img src='../../../tools/logos/motiveminds.png'>
</div>

<h1 style='text-align:center'>$IFLOW_NAME</h1>
<h2 style='text-align:center'>Technical Specification Document</h2>

<table style='width:60%; margin:auto'>
<tr><th>Author</th><td>$AUTHOR</td></tr>
<tr><th>Date</th><td>$DATE</td></tr>
</table>

<hr/>

$CONTENT

</body>
</html>" > "$OUTPUT_HTML"

            pandoc "$OUTPUT_HTML" -o "$OUTPUT_DOCX"
          done

      - name: Commit and Push DOCX
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cpi-artifacts/**/*.docx
          git commit -m "🤖 DOCS: Generate iFlow Technical Specification (DOCX)" || echo "Nothing to commit"
          git push
