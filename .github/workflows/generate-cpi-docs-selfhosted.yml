name: Generate CPI Documentation (Self-Hosted AI)

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Enter CPI Package Folder Name"
        required: true
        default: "EmailreceiverxlsxToXML"

jobs:
  generate-docs:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python & Install Dependencies
        shell: powershell
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install requests python-docx

      - name: Verify Ollama is Running
        shell: powershell
        run: |
          ollama --version
          ollama list

      - name: Generate CPI Documentation using Ollama
        shell: powershell
        run: |
          python tools\generate_iflow_docs.py --package "${{ github.event.inputs.package }}"

      - name: Commit generated documentation
        shell: powershell
        run: |
          git status
          git add cpi-artifacts
          if (-not (git diff --cached --quiet)) {
            git commit -m "AI-generated CPI documentation"
            git push
          } else {
            Write-Host "No documentation changes to commit."
          }
