name: Generate CPI iFlow Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl start ollama

      - name: Pull DeepSeek R1 Model
        run: |
          ollama pull deepseek-r1

      - name: Generate Documentation
        run: |
          chmod +x tools/run_generate_docs.sh
          ./tools/run_generate_docs.sh

      - name: Commit Documentation
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"

          git add docs_generated || true

          if git diff --staged --quiet; then
            echo "No new docs to commit"
          else
            git commit -m "Auto-generated CPI iFlow documentation"
            git push
          fi
