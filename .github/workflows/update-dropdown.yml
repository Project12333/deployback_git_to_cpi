name: Auto-Update CPI Package Dropdown

on:
  push:
    paths:
      - 'cpi-artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dropdown:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Get package list under cpi-artifacts/
      - name: Build package list
        id: packages
        run: |
          packages=$(find cpi-artifacts -maxdepth 1 -type d -printf '%f\n' | tail -n +2 | tr '\n' ' ')
          echo "packages=$packages" >> $GITHUB_OUTPUT
          echo "Found packages: $packages"

      # Update the dropdown in selectfiledeploy.yml
      - name: Update deploy workflow options
        run: |
          repo_file=".github/workflows/selectfiledeploy.yml"
          packages="${{ steps.packages.outputs.packages }}"

          arr=($packages)
          opts=""
          for pkg in "${arr[@]}"; do
            opts="$opts\"$pkg\", "
          done
          opts="[${opts%, }]"

          sed -i "s|^ *options:.*|options: $opts|" "$repo_file"

          echo "Updated dropdown to: $opts"
          echo "Updated file content:"
          sed -n '1,80p' "$repo_file"

      # Commit and push changes
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/selectfiledeploy.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update CPI package dropdown"
          git push
