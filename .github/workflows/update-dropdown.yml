name: Auto-Update CPI Package Dropdown

on:
  push:
    paths:
      - 'cpi-artifacts/**'
  workflow_dispatch:

jobs:
  update-dropdown:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get package list
        id: packages
        run: |
          packages=$(ls -1 cpi-artifacts | tr '\n' ' ')
          echo "packages=$packages" >> $GITHUB_OUTPUT

      - name: Update deploy workflow
        run: |
          arr=(${{ steps.packages.outputs.packages }})
          options=""
          for pkg in "${arr[@]}"; do
            options="$options\"$pkg\", "
          done
          options="[${options%, }]"
          sed -i "s|^options:.*|options: $options|" .github/workflows/deploy.yml

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .github/workflows/deploy.yml
          if git commit -m "Auto-update package dropdown"; then
            git push origin HEAD
          else
            echo "No changes to commit"
          fi
