name: Generate CPI iFlow Docs (Ollama)

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "Select a CPI Package"
        required: true
        type: choice
        options: ${{ fromJson(needs.discover.outputs.package_list) }}

permissions:
  contents: write

jobs:

  discover:
    runs-on: ubuntu-latest
    outputs:
      package_list: ${{ steps.scan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository for packages
        id: scan
        run: |
          chmod +x tools/discover_packages.sh
          result=$(tools/discover_packages.sh)
          echo "packages=$result" >> $GITHUB_OUTPUT

  generate_docs:
    needs: discover
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Pull Mistral
        run: |
          export PATH="$HOME/.ollama/bin:$PATH"
          ollama pull mistral

      - name: Install Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip

      - name: Generate documentation
        run: |
          PACKAGE="${{ github.event.inputs.package_id }}"
          FILES=$(find cpi-artifacts/$PACKAGE -type f -name "*.iflw")

          echo "Processing files: $FILES"

          python3 tools/generate_iflow_docs.py $FILES

      - name: Commit documentation
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Generated documentation for ${{ github.event.inputs.package_id }}"
          git push
