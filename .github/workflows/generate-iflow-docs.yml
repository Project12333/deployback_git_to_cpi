name: Generate CPI iFlow Documentation (Markdown + DOCX)

on:
  push:
    branches: 
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # ---------------------------------------------------------
      # Detect changed .iflw files OR all if manual run
      # ---------------------------------------------------------
      - name: Determine changed .iflw files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files=$(git ls-files "src/main/resources/**/*.iflw")
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              files=$(git ls-files "src/main/resources/**/*.iflw")
            else
              files=$(git diff --name-only "$BEFORE" "$AFTER" -- "src/main/resources/**/*.iflw")
            fi
          fi

          files=$(echo "$files" | tr '\n' ',' | sed 's/,$//')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Install Ollama
      # ---------------------------------------------------------
      - name: Install Ollama
        if: steps.changed.outputs.files != ''
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          export PATH="$HOME/.ollama/bin:$PATH"

      - name: Pull Mistral Model
        if: steps.changed.outputs.files != ''
        run: |
          export PATH="$HOME/.ollama/bin:$PATH"
          ollama pull mistral

      # ---------------------------------------------------------
      # Install Pandoc for DOCX generation
      # ---------------------------------------------------------
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # ---------------------------------------------------------
      # Generator script
      # ---------------------------------------------------------
      - name: Add generator script
        run: |
          mkdir -p tools
          cat > tools/generate_iflow_docs.py << 'EOF'
#!/usr/bin/env python3
import sys, os, json, subprocess, tempfile
import xml.etree.ElementTree as ET
from pathlib import Path

def parse_iflw(path):
    try:
        tree = ET.parse(path)
        root = tree.getroot()
    except Exception as e:
        return {"error": str(e)}

    info = {
        "flowname": Path(path).stem,
        "file": str(path),
        "adapters": [],
        "scripts": [],
        "mappings": [],
        "exceptions": [],
        "properties": []
    }

    for elem in root.iter():
        tag = elem.tag.split('}')[-1].lower()
        name = elem.attrib.get("name") or elem.attrib.get("id")

        if any(x in tag for x in ["adapter", "sender", "receiver"]):
            info["adapters"].append({"tag": tag, "name": name})

        if "script" in tag or "groovy" in tag:
            info["scripts"].append({"tag": tag, "name": name})

        if "mapping" in tag:
            info["mappings"].append({"tag": tag, "name": name})

        if "exception" in tag or "error" in tag:
            info["exceptions"].append({"tag": tag, "name": name})

        if "property" in tag or "header" in tag:
            info["properties"].append({"tag": tag, "name": name})

    with open(path, "r", errors="ignore") as f:
        info["xml_sample"] = f.read(20000)

    return info

def build_prompt(summary):
    return f"""
You are an SAP CPI Architect.

Generate a complete CPI iFlow documentation in **Markdown**.

Include:
- Title  
- Purpose  
- Overview  
- Sender/Receiver details  
- Groovy scripts explanation  
- Mappings  
- Exception handling  
- Properties / Headers  
- Message flow steps  
- Deployment notes  
- Test cases  

iFlow Summary:
{json.dumps(summary, indent=2)}
"""

def run_ollama(prompt):
    with tempfile.NamedTemporaryFile("w+", delete=False) as tf:
        tf.write(prompt)
        tf.flush()
        temp = tf.name

    try:
        cmd = f"ollama run mistral < {temp}"
        result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
        if result.returncode != 0:
            return None
        return result.stdout
    finally:
        os.unlink(temp)

def write_docs(path, md_content):
    base = Path(path).parent / "docs"
    base.mkdir(exist_ok=True)

    flowname = Path(path).stem
    md_file = base / f"{flowname}_Documentation.md"
    docx_file = base / f"{flowname}_Documentation.docx"

    md_file.write_text(md_content, encoding="utf-8")

    subprocess.run(["pandoc", str(md_file), "-o", str(docx_file)])

    return md_file, docx_file

def main(paths):
    for p in paths:
        summary = parse_iflw(p)
        if "error" in summary:
            print("Error:", summary["error"])
            continue

        prompt = build_prompt(summary)
        md = run_ollama(prompt)

        if not md:
            print("Ollama generation failed for:", p)
            continue

        md_path, docx_path = write_docs(p, md)
        print("Generated:", md_path, "and", docx_path)

if __name__ == "__main__":
    main(sys.argv[1:])
EOF

      - name: Make script executable
        run: chmod +x tools/generate_iflow_docs.py

      # ---------------------------------------------------------
      # Run generator
      # ---------------------------------------------------------
      - name: Run Documentation Generator
        run: |
          export PATH="$HOME/.ollama/bin:$PATH"
          files="${{ steps.changed.outputs.files }}"

          if [ -z "$files" ]; then
            echo "No .iflw changes detected."
            exit 0
          fi

          IFS=',' read -r -a arr <<< "$files"
          python3 tools/generate_iflow_docs.py "${arr[@]}"

      # ---------------------------------------------------------
      # Commit generated docs
      # ---------------------------------------------------------
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-generate CPI iFlow Documentation (MD + DOCX)"
          git push
