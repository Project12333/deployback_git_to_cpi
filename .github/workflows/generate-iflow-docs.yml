name: Generate CPI iFlow Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  doc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Detect .iflw files
        id: changed
        run: |
          # Find all .iflw files under cpi-artifacts
          files=$(find cpi-artifacts -type f -name "*.iflw" -print)

          echo "Detected files:"
          echo "$files"

          # convert newline separated to space separated single-line
          files=$(echo "$files" | tr '\n' ' ' | sed 's/ $//')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Install Ollama
        if: ${{ steps.changed.outputs.files != '' }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Pull Mistral model
        if: ${{ steps.changed.outputs.files != '' }}
        run: |
          export PATH="$HOME/.ollama/bin:$PATH"
          ollama pull mistral || true

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Generate Docs
        if: ${{ steps.changed.outputs.files != '' }}
        run: |
          export PATH="$HOME/.ollama/bin:$PATH"
          echo "Running generator on files: ${{ steps.changed.outputs.files }}"
          python3 tools/generate_iflow_docs.py ${{ steps.changed.outputs.files }}

      - name: Commit documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-generated CPI iFlow Documentation"
          git push
