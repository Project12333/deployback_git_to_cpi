name: Generate CPI iFlow Documentation (FAST)

on:
  workflow_dispatch:
    inputs:
      package_id:
        type: string
        required: true
        description: "Enter the package folder name inside cpi-artifacts"

      version_mode:
        type: choice
        required: false
        default: "none"
        description: "Versioning mode"
        options:
          - none
          - manual
          - date
          - git-sha

      version_value:
        type: string
        required: false
        description: "If manual mode, specify version (e.g. 1.4)"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Reference Template
        run: |
          if [ ! -f tools/reference.docx ]; then
            echo "❌ tools/reference.docx not found!"
            exit 1
          fi
          echo "✔ reference.docx found"

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pandoc jq python3-pip
          pip3 install python-docx requests

      - name: Enable Docker (Fix for Ubuntu 24.04 containerd conflict)
        uses: docker/setup-docker@v4

      - name: Start Ollama Container & Pull Model
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          echo "Waiting for Ollama to start..."
          sleep 12
          docker exec ollama ollama pull deepseek-r1:1.5b
          docker exec ollama ollama run deepseek-r1:1.5b "warmup"

      - name: Ensure Tools Are Executable
        run: chmod +x tools/*.sh tools/*.py || true

      - name: Ensure Logos Exist
        run: |
          mkdir -p tools/logos
          echo "Logos directory ready:"
          ls -la tools/logos || true

      - name: Generate Documentation
        env:
          VERSION_MODE: ${{ github.event.inputs.version_mode }}
          VERSION_VALUE: ${{ github.event.inputs.version_value }}
        run: |
          tools/ollama_generate_docs.sh "${{ github.event.inputs.package_id }}"

      - name: Commit Documentation
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add cpi-artifacts/${{ github.event.inputs.package_id }}/docs || true

          if git diff --cached --quiet; then
            echo "✔ No new files to commit"
            exit 0
          fi

          git commit -m "Generated CPI Documentation for ${{ github.event.inputs.package_id }}"
          git push || true
