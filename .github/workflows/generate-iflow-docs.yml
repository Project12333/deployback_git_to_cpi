name: Generate CPI iFlow Documentation (FAST)

on:
  workflow_dispatch:
    inputs:
      package_id:
        type: string
        required: true
        description: "Enter the package folder name inside cpi-artifacts"

      version_mode:
        type: choice
        required: false
        default: "none"
        options:
          - none
          - manual
          - date
          - git-sha

      version_value:
        type: string
        required: false
        description: "If manual mode, enter version (e.g. 1.5)"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify reference template
        run: |
          if [ ! -f tools/reference.docx ]; then
            echo "❌ tools/reference.docx missing!"
            exit 1
          else
            echo "✔ tools/reference.docx found"
          fi

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pandoc jq python3-pip docker.io
          pip3 install python-docx requests

      - name: Start Ollama container + pull model
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest || true
          sleep 10
          docker exec ollama ollama pull deepseek-r1:1.5b || true
          docker exec ollama ollama run deepseek-r1:1.5b "warmup" || true

      - name: Make tools executable
        run: chmod +x tools/*.sh tools/*.py

      - name: Ensure logos directory
        run: |
          mkdir -p tools/logos
          # If repository contains logos in a chosen folder, copy them to tools/logos
          if [ -f assets/sap.png ]; then cp assets/sap.png tools/logos/sap.png; fi
          if [ -f assets/motiveminds.png ]; then cp assets/motiveminds.png tools/logos/motiveminds.png; fi
          ls -la tools/logos || true

      - name: Generate Documentation
        env:
          VERSION_MODE: ${{ github.event.inputs.version_mode }}
          VERSION_VALUE: ${{ github.event.inputs.version_value }}
        run: |
          tools/ollama_generate_docs.sh "${{ github.event.inputs.package_id }}"

      - name: Commit documentation
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cpi-artifacts/${{ github.event.inputs.package_id }}/docs || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Generated CPI Documentation for package ${{ github.event.inputs.package_id }}"
          git push || true
