name: Generate CPI iFlow Documentation (FAST)

on:
  workflow_dispatch:
    inputs:
      package_id:
        type: string
        required: true
        description: "Enter the package folder name inside cpi-artifacts"

      version_mode:
        type: choice
        required: false
        default: "none"
        description: "Select version mode"
        options:
          - none
          - manual
          - date
          - git-sha

      version_value:
        type: string
        required: false
        description: "If manual mode, enter version (e.g. 1.5)"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify reference template
        run: |
          if [ ! -f tools/reference.docx ]; then
            echo "❌ reference.docx missing!"
            exit 1
          else
            echo "✔ reference.docx found"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pandoc jq python3-pip
          pip install python-docx

      - name: Start Ollama container + pull fast model
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          sleep 10
          docker exec ollama ollama pull deepseek-r1:1.5b
          docker exec ollama ollama run deepseek-r1:1.5b "warmup"

      - name: Make tools executable
        run: chmod +x tools/*.sh tools/*.py

      - name: Generate Documentation
        run: |
          export VERSION_MODE="${{ github.event.inputs.version_mode }}"
          export VERSION_VALUE="${{ github.event.inputs.version_value }}"
          tools/ollama_generate_docs.sh "${{ github.event.inputs.package_id }}"

      - name: Commit documentation
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cpi-artifacts/${{ github.event.inputs.package_id }} || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Generated CPI Documentation for package ${{ github.event.inputs.package_id }}"
          git push || true
