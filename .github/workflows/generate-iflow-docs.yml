name: FAST CPI Docs

on:
  workflow_dispatch:
    inputs:
      package_id:
        required: true
        type: string

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq pandoc

      - name: Start Fast Ollama
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          sleep 10
          docker exec ollama ollama pull deepseek-r1:1.5b

          # ⚡ Warm up model
          docker exec ollama ollama run deepseek-r1:1.5b "hello"

      - name: Make scripts executable
        run: chmod +x tools/*.sh tools/*.py

      - name: Run FAST generator
        run: tools/ollama_generate_docs.sh "${{ github.event.inputs.package_id }}"

      - name: Commit docs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cpi-artifacts/${{ github.event.inputs.package_id }} || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "FAST docs generated for ${{ github.event.inputs.package_id }}"
          git push || true
