name: Generate CPI Package Docs (DeepSeek)

on:
  workflow_dispatch:
    inputs:
      package_id:
        type: string
        required: true
        description: "Package ID to document"

permissions:
  contents: write

jobs:
  build_docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Pull DeepSeek R1 14B
        run: |
          export PATH="$HOME/.ollama/bin:$PATH"
          ollama pull deepseek-r1:14b

      - name: Run documentation generator
        run: |
          chmod +x tools/ollama_generate_docs.sh
          tools/ollama_generate_docs.sh "${{ github.event.inputs.package_id }}"

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          PKG="cpi-artifacts/${{ github.event.inputs.package_id }}/Package_Summary.md"

          git add "$PKG"
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Generated documentation (DeepSeek) for package ${{ github.event.inputs.package_id }}"
          git push
