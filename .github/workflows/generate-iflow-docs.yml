name: Generate CPI iFlow Documentation (DeepSeek)

on:
  workflow_dispatch:
    inputs:
      package_id:
        type: string
        required: true

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pandoc jq python3-pip
          pip3 install python-docx requests

      - name: Verify Docker (already installed on GitHub runner)
        run: |
          docker --version
          docker info

      - name: Start Ollama container + load DeepSeek
        run: |
          docker pull ollama/ollama:latest
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          echo "Waiting for Ollama to start..."
          sleep 10
          docker exec ollama ollama pull deepseek-r1:1.5b
          docker exec ollama ollama run deepseek-r1:1.5b "warmup"

      - name: Prepare logos
        run: |
          mkdir -p tools/logos
          ls -la tools/logos || true

      - name: Generate documentation
        run: |
          chmod +x tools/*.sh tools/*.py
          tools/ollama_generate_docs.sh "${{ github.event.inputs.package_id }}"

      - name: Commit generated docs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add cpi-artifacts/${{ github.event.inputs.package_id }}/docs || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Generated docs for package ${{ github.event.inputs.package_id }}"
          git push || true
